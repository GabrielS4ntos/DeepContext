[project]
name = "deepcontext"
version = "0.1.0"
description = "Autonomous research agent with web search and Qdrant semantic memory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.121.1",
    "gunicorn>=23.0.0",
    "httpx>=0.27.0",
    "langchain>=1.3.9",
    "langchain-openai>=1.3.2",
    "langgraph>=1.2.5",
    "pydantic-settings>=2.12.0",
    "qdrant-client>=1.16.2",
    "sse-starlette>=3.0.3",
    "uvicorn>=0.38.0",
    "langfuse>=3.9.1",
    "opentelemetry-sdk>=1.39.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.39.1",
    "opentelemetry-instrumentation-fastapi>=0.60b1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"deepcontext.instructions" = ["*.md"]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "W"]

[tool.mypy]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
