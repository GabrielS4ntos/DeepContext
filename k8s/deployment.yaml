apiVersion: apps/v1
kind: Deployment
metadata:
  name: deepcontext-agent
  labels:
    app.kubernetes.io/name: deepcontext-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: deepcontext-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deepcontext-agent
    spec:
      containers:
        - name: agent
          image: ghcr.io/your-org/deepcontext-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - secretRef:
                name: deepcontext-agent-env
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi

